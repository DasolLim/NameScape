[project]
name = "namescape-api"
version = "0.1.0"
description = "NameScape API"
authors = [{ name = "Dasol Lim" }]
license = { text = "Proprietary. Copyright (c) 2026 Dasol Lim. All rights reserved." }
# Upper bound removed: Vercel's Python runtime is 3.13/3.14.
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "sqlalchemy[asyncio]",
    "asyncpg",
    "alembic",
    "redis",
    "pydantic-settings",
    "httpx",
    "geoalchemy2>=0.20.0",
    "itsdangerous>=2.2.0",
    "pydantic[email]>=2.13.5",
    "pyyaml>=6.0.3",
    "types-pyyaml>=6.0.12.20260815",
    "apscheduler>=3.11.3",
    "pillow>=12.3.0",
    "prometheus-client>=0.26.0",
    "sentry-sdk>=2.68.1",
    "aiosmtplib>=5.1.2",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "mypy",
    "ruff",
    "fakeredis>=2.37.1",
    "pytest-cov>=7.1.0",
    "schemathesis>=4.25.2",
    "hypothesis>=6.165.10",
    "locust>=2.46.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.mypy]
strict = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_unused_ignores = true
warn_return_any = true
files = ["app", "tests"]

[[tool.mypy.overrides]]
module = ["asyncpg.*", "geoalchemy2.*", "apscheduler.*"]
ignore_missing_imports = true

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "A", "C4", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# These files exist to handle homoglyph evasion, so they must contain the
# ambiguous characters RUF001/RUF003 warn about.
"app/modules/moderation/normalize.py" = ["RUF001", "RUF003"]
"tests/modules/moderation/test_screen.py" = ["RUF001", "RUF003"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.coverage.run]
source = ["app/modules"]

[tool.coverage.report]
fail_under = 80
show_missing = true
