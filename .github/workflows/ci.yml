name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.5
        env:
          POSTGRES_USER: toponomicon
          POSTGRES_PASSWORD: toponomicon
          POSTGRES_DB: toponomicon
        ports: ["55432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 12
      redis:
        image: redis:7-alpine
        ports: ["56379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s
          --health-timeout 3s --health-retries 12
      # A real inbox, so the sign-in mail is genuinely sent and read back.
      mailpit:
        image: axllent/mailpit:latest
        ports: ["1025:1025", "8025:8025"]
        env:
          MP_SMTP_AUTH_ACCEPT_ANY: "true"
          MP_SMTP_AUTH_ALLOW_INSECURE: "true" 
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: uv sync
        working-directory: api
      - run: npm ci
        working-directory: web

      - run: uv run alembic upgrade head
        working-directory: api

      - name: Typecheck, lint, test
        run: |
          cd api
          uv run mypy
          uv run ruff check .
          uv run ruff format --check .
          uv run pytest -q --cov --cov-report=term-missing
          cd ../web
          npm run typecheck
          npm run lint
          npm run test

      - name: Generated API types are current
        run: |
          make gen-types
          git diff --exit-code web/src/api/schema.ts

      - name: Schemathesis contract fuzz
        env:
          # The limiter answers before body validation, which is right in
          # production but hides validation failures from the fuzzer.
          WRITES_PER_MINUTE: "100000"
        run: |
          cd api
          uv run uvicorn app.main:app --port 8000 &
          for i in $(seq 1 20); do curl -sf http://localhost:8000/api/health && break; sleep 1; done
          # Two checks are excluded, deliberately:
          #   positive_data_acceptance - a schema-valid sign-in token that does
          #     not exist must still be 401. The check cannot tell a malformed
          #     request from a well-formed one that is semantically wrong.
          #   allow_header_conformance - Starlette's 405 omits the Allow
          #     header. Framework behaviour, not application logic.
          uv run schemathesis run http://localhost:8000/openapi.json \
            --max-examples 25 \
            --exclude-checks positive_data_acceptance,allow_header_conformance
          # Playwright starts its own API; leaving this one bound to :8000
          # makes its webServer refuse to start.
          kill %1

      # The browser tests search for real places and sign in as seeded users.
      # Called directly, not through make: the make targets start Docker
      # Compose, and CI supplies Postgres and Redis as service containers.
      - name: Seed the database for the browser tests
        run: |
          cd api
          uv run python scripts/import_geonames.py tests/fixtures/geonames_sample.txt
          uv run python scripts/seed_demo.py

      - name: E2E
        env:
          MAIL_INBOX_URL: http://localhost:8025
        run: |
          cd web && npx playwright install chromium --with-deps
          cd .. && make e2e
